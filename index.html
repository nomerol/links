<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>energetics</title>
    <style>
        :root {
            --bg-color: #F0F5F9;        /* 60% Доминантный */
            --button-color: #C8D9E0;    /* 30% Вторичный */
            --accent-color: #CECED7;    /* 10% Акцент */
            --text-color: #1A1A1A;      
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        /* Контейнер аватарки */
        .avatar-placeholder {
            width: 96px;
            height: 96px;
            background-color: var(--accent-color);
            border-radius: 50%;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden; /* Чтобы фото не вылезало за края круга */
        }

        /* Стили для твоей фотографии */
        .avatar-placeholder img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        /* Никнейм */
        .profile-name {
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 24px;
            letter-spacing: -0.5px;
        }

        /* Минималистичная разделительная линия */
        .separator {
            width: 100%;
            height: 1px;
            border: none;
            background-color: var(--accent-color);
            margin-bottom: 28px;
            opacity: 0.8;
        }

        /* Контейнер для кнопок */
        .links-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* Кнопки */
        .link-item {
            display: block;
            width: 100%;
            padding: 16px 20px;
            background-color: var(--button-color);
            color: var(--text-color);
            text-decoration: none; 
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 500;
            transition: all 0.25s ease;
        }

        /* Эффект при нажатии/наведении */
        .link-item:hover, .link-item:active {
            background-color: var(--accent-color);
            transform: translateY(-1px);
        }

        /* Адаптив под мелкие экраны */
        @media (max-width: 360px) {
            body { padding: 24px 16px; }
            .avatar-placeholder { width: 80px; height: 80px; }
            .link-item { padding: 14px 16px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="avatar-placeholder">
            <img src="myfoto.jpg" alt="energetics">
        </div>

        <h1 class="profile-name">neo</h1>

        <hr class="separator">

        <div class="links-container">
            <a href="https://soundcloud.com/lolenergetics" class="link-item" target="_blank">soundcloud</a>
            <a href="https://www.imdb.com/user/p.kn64oaoorsdsf6ojtuejiz7sce?ref_=hm_nv_profile" class="link-item" target="_blank">imdb</a>
            <a href="https://steamcommunity.com/id/lolenergetics/" class="link-item" target="_blank">steam</a>
            <a href="https://www.instagram.com/lolenergetics/" class="link-item" target="_blank">instagram</a>
        </div>
    </div>

</body>
</html>
